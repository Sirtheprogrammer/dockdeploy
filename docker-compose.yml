name: dockdeploy

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: dockdeploy:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SQLite is used by default when DATABASE_URL is unset.
      # Persistent storage path mapped to the dockdeploy-data volume:
      SQLITE_PATH: ${SQLITE_PATH:-/home/app/data/dockdeploy.db}
      # To use PostgreSQL instead, set DATABASE_URL in your .env:
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      # Persists SQLite database and application data
      - dockdeploy-data:/home/app/data
      # Lets the controller manage its own host as a "local" server.
      # Comment out if you only ever manage remote machines over SSH.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dockdeploy-data:
